<style>

@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/plex-latin-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --red:#C1121F; --red2:#9B0E19; --redbg:#FDECEE; --ink:#18181B; --ink2:#3F3F46; --mut:#71717A; --mut2:#A1A1AA; --line:#E7E7EB; --bg:#F4F4F6; --page:#FAFAFB; --card:#fff;
  --ok:#1B7A3E; --okbg:#E7F5EC; --warn:#A35A00; --warnbg:#FFF4E0; --bad:#B3261E; --badbg:#FDECEA; --blue:#1F4E9E; --bluebg:#E8EFFB;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  font-family:"IBM Plex Sans Arabic",-apple-system,"SF Arabic","Geeza Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{overflow:hidden;font-size:16px;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:inherit}
.num,.money{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:17px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--redbg);color:var(--red)}
.btn.dark{background:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.blue{background:var(--blue)}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px;border-radius:10px}
.btn.block{width:100%}
.link{color:var(--red);font-weight:600;padding:6px}

/* centered screens */
.center{flex:1;display:grid;place-items:center;padding:24px;overflow:auto}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:28px;width:min(440px,100%)}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:18px;text-align:center}
.brand .logo{width:64px;height:64px;border-radius:16px;overflow:hidden;background:var(--red);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}
.brand h1{margin:8px 0 0;font-size:24px}
.brand p{margin:0;color:var(--mut);font-size:14px}
.f{display:grid;gap:6px;margin-bottom:12px}
.f label{font-size:14px;color:var(--mut);font-weight:600}
.f input,.f select,.f textarea{min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:17px;width:100%}
.f textarea{padding:10px 14px;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--red)}
.f .hint{font-size:13px;color:var(--mut)}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.note{background:var(--bluebg);color:#173a76;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.note.warn{background:var(--warnbg);color:#6b3b00}
.muted{color:var(--mut)}
.small{font-size:13px}

/* PIN */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:8px 0 4px}
.who button{min-height:84px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:700;display:grid;place-items:center;gap:2px;padding:8px}
.who button small{font-size:12px;color:var(--mut);font-weight:500}
.who button.on{border-color:var(--red);background:var(--redbg);color:var(--red)}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{min-height:64px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:26px;font-weight:600}
.pad button:active{background:var(--redbg)}
.pad button.fn{font-size:17px;color:var(--mut)}

.prepgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.prep{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;background:#fff}
.prep.warn{border-color:#F0B860}.prep.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--badbg)}
.prep .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prep .ph .no{font-size:24px;font-weight:900}
.prep .ph .tm{font-weight:800;font-size:15px;padding:2px 8px;border-radius:8px;background:var(--okbg);color:var(--ok)}
.prep.warn .ph .tm{background:var(--warnbg);color:var(--warn)}.prep.bad .ph .tm{background:var(--badbg);color:var(--bad)}
.prep ul{list-style:none;margin:0 0 10px;padding:0;flex:1}
.prep li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:16px}
.prep li:last-child{border-bottom:0}
.prep .pm{font-size:14px;color:var(--warn);font-weight:700;padding-inline-start:12px}
.prep .pn{font-size:14px;color:var(--blue);font-weight:800;padding-inline-start:12px}
.prep .pf{display:flex;gap:8px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;text-align:start;width:100%}
.row .no{font-weight:900;font-size:20px;min-width:62px}
.row .meta{font-size:13px;color:var(--mut)}
.row.void{opacity:.55;text-decoration:line-through}
.chip{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:700;background:var(--bg);color:var(--mut)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.lk{background:#EFE6F7;color:#5B2A86}
.chip.test{background:#FFE9A8;color:#6b4e00}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start}
table.t th{color:var(--mut);font-size:13px;font-weight:700;background:var(--bg)}
table.t td.n,table.t th.n{text-align:left}
table.t tfoot td{font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line)}
.tabs button{min-height:42px;padding:0 16px;border-radius:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--redbg);color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg);border-radius:14px;padding:12px 14px}
.kpi > span{font-size:13px;color:var(--mut);font-weight:600;display:block}
.kpi b{display:block;font-size:22px;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.toolbar .f{margin:0}
.mrow{display:grid;grid-template-columns:56px minmax(120px,1.5fr) minmax(84px,.9fr) 76px 76px 76px 76px 52px 52px 60px 52px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow input,.mrow select{min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;width:100%;font-size:15px;background:#fff}
.mrow.h{font-size:12px;color:var(--mut);font-weight:700}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#D9D5D2;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}
.sw.on::after{right:25px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow div b{display:block}
.setrow div span{font-size:13px;color:var(--mut)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center;animation:fade .2s}
.toast.bad{background:var(--bad)}
.rcpt{background:#fff;border:1px solid var(--line);border-radius:8px;max-width:100%;display:block;margin:0 auto}
.testbar{background:#FFE9A8;color:#6b4e00;text-align:center;font-weight:700;font-size:14px;padding:4px}
#print{display:none}
@media print{
  @page{size:80mm auto;margin:0}
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;inset:0 auto auto 0;width:80mm}
  #print img{width:72mm;margin:0 4mm}
}
@media (max-width:700px){.mrow{grid-template-columns:1fr 1fr}}
